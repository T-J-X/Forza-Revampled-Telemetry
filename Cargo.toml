[workspace]
resolver = "2"
members = [
    "crates/fh6-core",
    "crates/fh6-clusters",
    "crates/fh6-osd",
    "crates/fh6-input",
    "crates/fh6-win",
    "crates/fh6-gpu",
    "crates/fh6-kit",
    "crates/fh6-app",
    "tools/preview-export",
    "tools/mock-udp",
    "tools/parity-dump",
    "tools/bench-render",
    "tools/web-preview",
    "tools/screen-capture",
    "tools/stand-in-game",
    "tools/wgc-bench",
    "tools/asset-forge",
    "tools/visual-review",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TJX <TJX@Ngage.com>"]
license = "MIT"
rust-version = "1.90"

# One lint table for every member (`[lints] workspace = true`), so AGENTS.md directive 6 is checked
# by the compiler and not by reading. Tests may unwrap, expect and panic (`clippy.toml`).
[workspace.lints.rust]
# `unsafe` lives in fh6-win and fh6-input only, which allow it at the crate root with a reason;
# the six safe library crates also `#![forbid(unsafe_code)]`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Directive 6: no unwrap(), expect() or panic! in non-test code.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Directive 2: no stubs presented as done.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Directive 6: every `unsafe` block names its invariant in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
# With the MSRV at 1.90, clippy 1.100 suggests `as_chunks` (stable in 1.88) for about 40
# `chunks_exact` calls in 21 files. The change is mechanical and style only; it waits for a quiet
# moment rather than touching files other phases are editing (backlog, `docs/PROGRESS.md`).
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
arc-swap = "1.7"
png = "0.17"
windows = "0.62"
wgpu = { version = "30.0.2", default-features = false, features = ["dx12", "webgpu", "wgsl", "std", "parking_lot"] }
bytemuck = { version = "1.21", features = ["derive"] }
raw-window-handle = "0.6"

# Loading a font face shapes 4,624 kerning pairs (rustybuzz) and rasterises about 70 MTSDF
# glyphs (fdsm on nalgebra). Unoptimised that is about 5 s per face, which every kit test and
# every debug start pays; optimised it is well under 0.2 s. Keep these fast in debug builds.
[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

[profile.dev.package.fdsm]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3

# The live overlay is CPU-bound in wgpu-core and the DX12 backend (known defect 10): whole-program
# optimisation lets the frame path inline across crates. `panic` stays `unwind` (known defect 18).
[profile.release]
lto = "thin"
codegen-units = 1
