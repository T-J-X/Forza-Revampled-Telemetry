[workspace]
resolver = "2"
members = [
    "crates/fh6-core",
    "crates/fh6-render",
    "crates/fh6-clusters",
    "crates/fh6-osd",
    "crates/fh6-input",
    "crates/fh6-win",
    "crates/fh6-gpu",
    "crates/fh6-kit",
    "crates/fh6-app",
    "tools/preview-export",
    "tools/mock-udp",
    "tools/parity-dump",
    "tools/bench-render",
    "tools/web-preview",
    "tools/screen-capture",
    "tools/stand-in-game",
    "tools/wgc-bench",
    "tools/asset-forge",
    "tools/visual-review",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TJX <TJX@Ngage.com>"]
license = "MIT"
rust-version = "1.87"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
tiny-skia = "0.11"
arc-swap = "1.7"
png = "0.17"
windows = "0.62"
wgpu = { version = "30.0.2", default-features = false, features = ["dx12", "webgpu", "wgsl", "std", "parking_lot"] }
bytemuck = { version = "1.21", features = ["derive"] }
raw-window-handle = "0.6"

# Loading a font face shapes 4,624 kerning pairs (rustybuzz) and rasterises about 70 MTSDF
# glyphs (fdsm on nalgebra). Unoptimised that is about 5 s per face, which every kit test and
# every debug start pays; optimised it is well under 0.2 s. Keep these fast in debug builds.
[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

[profile.dev.package.fdsm]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3
