[package]
name = "fh6-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "FH6_WheelDash"
path = "src/main.rs"

[[bin]]
name = "FH6_SteamLauncher"
path = "src/bin/steam_launcher.rs"

[dependencies]
fh6-core = { path = "../fh6-core" }
fh6-render = { path = "../fh6-render" }
fh6-clusters = { path = "../fh6-clusters" }
fh6-osd = { path = "../fh6-osd" }
fh6-input = { path = "../fh6-input" }
fh6-win = { path = "../fh6-win" }
tracing.workspace = true
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_XboxController",
]
