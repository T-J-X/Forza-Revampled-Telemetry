[package]
name = "fh6-osd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fh6-core = { path = "../fh6-core" }
fh6-clusters = { path = "../fh6-clusters" }
fh6-kit = { path = "../fh6-kit" }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true

# The gates in `host.rs` run the OSD on wgpu's no-op device and count a warm frame's allocations.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wgpu = { workspace = true, features = ["noop"] }
allocation-counter = "0.8.1"
